    "recyclerview"
]

android-jetpack = [
    "lifecycle-viewmodel", "lifecycle-runtime", "lifecycle-livedata",
    "activity", "fragment",
    "navigation-fragment",
    "preference-ktx",
    "work-runtime", "guava"
