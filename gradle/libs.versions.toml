materialIconsCore = "1.7.8"
# KMP 版图标库。Android target 只是委托到 androidx 同名制品，不会重复打包。
jetbrainsMaterialIconsCore = "1.7.3"
ksp = "2.3.11"
drawerlayout = "1.2.0"
# Dependencies
about = "2.5.2"
core = "1.19.0"
appcompat = "1.8.0"
material = "1.14.0"
coroutines = "1.11.0"
activity = "1.13.0"
fragment = "1.9.0"
constraintLayout = "2.2.2"
recyclerView = "1.4.0"
expandableTextView = "v1.6.1-x"
