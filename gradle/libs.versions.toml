htmlconverter = "1.1.1"
kotlinxIo = "0.9.1"
mmkvKotlin = "1.5.1"
mmkv = "2.4.1"
navigation = "2.9.8"
# nav3 的 UI 层分两个坐标：commonMain 用 JB fork（desktop/iOS 上是真实现），
# androidMain 用第一方（JB 的 -android 变体是个空壳，本来就转发到 androidx）。
# 两者互补不冲突，androidMain 这条只是把 Android 侧实现顶到最新 alpha。
nav3Jb = "1.2.0-alpha02"
nav3Androidx = "1.2.0-alpha07"
preferenceKtx = "1.2.1"
swiperefreshlayout = "1.2.0"
window = "1.5.1"
work = "2.11.2"
startupRuntime = "1.2.0"
palette = "1.0.0"
spannableX = "1.0.4"
datetime = "0.8.0"
serialization = "1.11.0"
gson = "2.14.0"
jsoup = "1.23.1"
ksoup = "0.2.6"
retrofit = "3.0.0"
converterSerialization = "1.0.0"
coil = "2.7.0"
okhttp = "5.4.0"
ktor = "3.5.2"
ktorfit = "2.7.5"
kermit = "2.1.0"
mpStools = "1.6.3"
sonner = "0.4.0"
jiaoziVideoPlayer = "7.7.2.3300"
junit = "4.13.2"
testJunit = "1.3.0"
testEspressoCore = "3.7.0"
guava = "33.6.0-android"
exoplayer = "1.11.0"
circularRevealSwitch = "0.4.6"
desugarJdkLibs = "2.1.5"
firebaseBom = "34.17.0"
firebaseApple = "12.17.0"
composeBom = "2026.08.00"
compose-material3 = "1.5.0-alpha26"
mpv = "v0.1.7"
ben-manes = "0.61.0"

[libraries]
# build-convention 专用：precompiled script plugin 要 apply 的插件必须先作为实现依赖
# 出现在 build-convention/build.gradle.kts 里，这几条只在那里用，主构建不引。
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-compiler-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "androidGradle" }
compose-multiplatform-gradle-plugin = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "composeMultiplatform" }
ksp-gradle-plugin = { module = "com.google.devtools.ksp:com.google.devtools.ksp.gradle.plugin", version.ref = "ksp" }

# Android
aboutlibraries-core = { module = "com.mikepenz:aboutlibraries-core", version.ref = "aboutlibraries" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "coreSplashscreen" }
androidx-material-icons-core = { module = "androidx.compose.material:material-icons-core", version.ref = "materialIconsCore" }
androidx-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
androidx-swiperefreshlayout = { module = "androidx.swiperefreshlayout:swiperefreshlayout", version.ref = "swiperefreshlayout" }
androidx-window = { module = "androidx.window:window", version.ref = "window" }
androidx-window-java = { module = "androidx.window:window-java", version.ref = "window" }
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coilCompose" }
# coil3 的网络层走 Ktor 而不是 OkHttp：这样图片请求能复用 commonMain 已有的
# HClientSpec client（getchu 图需要的 Referer/Cookie 那套就不用再写一遍），
# 而且 ktor3 版有 android / jvm / iosArm64 / iosSimulatorArm64 四个变体，okhttp 版只有前两个。
coil-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coilCompose" }
compose-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
# CMP WebView（Android=WebView / iOS=WKWebView / desktop=Nucleus Tao）。登录页和过盾页用。
composewebview = { module = "dev.nucleusframework:composewebview", version.ref = "composewebview" }
core = { group = "androidx.core", name = "core", version.ref = "core" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
crashx = { module = "io.github.tutorialsandroid:crashx", version.ref = "crashx" }
firebase-database = { module = "com.google.firebase:firebase-database" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintLayout" }
jetbrains-compose-material3 = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
jetbrains-compose-material-icons-core = { module = "org.jetbrains.compose.material:material-icons-core", version.ref = "jetbrainsMaterialIconsCore" }
recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerView" }
drawerlayout = { module = "androidx.drawerlayout:drawerlayout", version.ref = "drawerlayout" }
# Jetpack
lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "lifecycle" }
lifecycle-viewmodel-savedstate = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-savedstate", version.ref = "lifecycle" }
lifecycle-runtime = { group = "androidx.lifecycle", name = "lifecycle-runtime", version.ref = "lifecycle" }
lifecycle-livedata = { group = "androidx.lifecycle", name = "lifecycle-livedata", version.ref = "lifecycle" }
# 下面两个是 KMP 制品，给 commonMain 用（collectAsStateWithLifecycle / viewModel()），
# 别加进 android-jetpack bundle。
lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }
room-runtime = { group = "androidx.room3", name = "room3-runtime", version.ref = "room" }
room-compiler = { group = "androidx.room3", name = "room3-compiler", version.ref = "room" }
sqlite-bundled = { group = "androidx.sqlite", name = "sqlite-bundled", version.ref = "sqlite" }
sqlite-async = { group = "androidx.sqlite", name = "sqlite-async", version.ref = "sqlite" }
filekit-core = { module = "io.github.vinceglb:filekit-core", version.ref = "filekit" }
htmlconverter = { module = "be.digitalia.compose.htmlconverter:htmlconverter", version.ref = "htmlconverter" }
filekit-dialogs-compose = { module = "io.github.vinceglb:filekit-dialogs-compose", version.ref = "filekit" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinxIo" }
mmkv-kotlin = { module = "io.github.darriousliu:mmkv-kotlin", version.ref = "mmkvKotlin" }
mmkv = { module = "com.tencent:mmkv", version.ref = "mmkv" }
navigation-fragment = { group = "androidx.navigation", name = "navigation-fragment", version.ref = "navigation" }
navigation3-ui-jb = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "nav3Jb" }
navigation3-ui-androidx = { module = "androidx.navigation3:navigation3-ui", version.ref = "nav3Androidx" }
lifecycle-viewmodel-navigation3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }
preference-ktx = { group = "androidx.preference", name = "preference-ktx", version.ref = "preferenceKtx" }
work-runtime = { group = "androidx.work", name = "work-runtime", version.ref = "work" }
guava = { group = "com.google.guava", name = "guava", version.ref = "guava" }
startup-runtime = { group = "androidx.startup", name = "startup-runtime", version.ref = "startupRuntime" }
palette = { group = "androidx.palette", name = "palette", version.ref = "palette" }
# Compose
compose-multiplatform-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-multiplatform-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-multiplatform-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
# CMP 1.12 的 ui 模块本身没有 backhandler 包，要单独引这个制品才有
# androidx.compose.ui.backhandler.BackHandler。material3 会传递带进来，但直接用到的 API 显式声明。
compose-multiplatform-ui-backhandler = { module = "org.jetbrains.compose.ui:ui-backhandler", version.ref = "composeMultiplatform" }
# commonMain 里的 @Preview。注意 CMP 版是无参注解，没有 showBackground / showSystemUi。
compose-multiplatform-ui-tooling-preview = { module = "org.jetbrains.compose.ui:ui-tooling-preview", version.ref = "composeMultiplatform" }
compose-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "compose-material3" }
compose-ui-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }

# Parse
serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }
ksoup = { module = "com.fleeksoft.ksoup:ksoup", version.ref = "ksoup" }

# Network
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
converter-serialization = { group = "com.jakewharton.retrofit", name = "retrofit2-kotlinx-serialization-converter", version.ref = "converterSerialization" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-dns-over-https = { group = "com.squareup.okhttp3", name = "okhttp-dnsoverhttps", version.ref = "okhttp" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktorfit-lib-light = { module = "de.jensklingenberg.ktorfit:ktorfit-lib-light", version.ref = "ktorfit" }
ktorfit-ksp = { module = "de.jensklingenberg.ktorfit:ktorfit-ksp", version.ref = "ktorfit" }
kermit = { module = "co.touchlab:kermit", version.ref = "kermit" }
# 跨平台 String.sprintf。CMP 的 stringResource(res, vararg) 只认 %N$d/%N$s，
# 处理不了 %f，所以带小数格式化的地方要靠它。注意它不在 Maven Central，
# 源在 settings.gradle.kts 里单独声明。
mp-stools = { module = "net.sergeych:mp_stools", version.ref = "mpStools" }
sonner = { module = "io.github.dokar3:sonner", version.ref = "sonner" }

# Pic
coil = { group = "io.coil-kt", name = "coil", version.ref = "coil" }
# Test
junit = { group = "junit", name = "junit", version.ref = "junit" } # testImplementation
test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "testJunit" } # androidTestImplementation
test-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "testEspressoCore" } # androidTestImplementation

# video
jiaozi-video-player = { group = "cn.jzvd", name = "jiaozivideoplayer", version.ref = "jiaoziVideoPlayer" }
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "exoplayer" }
media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "exoplayer" }
media3-ui-compose = { group = "androidx.media3", name = "media3-ui-compose", version.ref = "exoplayer" }
mpv-lib = { group = "com.github.abdallahmehiz", name = "mpv-android", version.ref = "mpv" }

# Other
about = { group = "com.drakeet.about", name = "about", version.ref = "about" }
expandable-textview = { group = "com.github.MZCretin", name = "ExpandableTextView", version.ref = "expandableTextView" }
base-recyclerview-adapter-helper4 = { group = "io.github.cymchad", name = "BaseRecyclerViewAdapterHelper4", version.ref = "baseRecyclerViewAdapterHelper4" }
multitype = { group = "com.drakeet.multitype", name = "multitype", version.ref = "multiType" }
spannable-x = { group = "com.itxca.spannablex", name = "spannablex", version.ref = "spannableX" }
datetime = { group = "org.jetbrains.kotlinx", name = "kotlinx-datetime", version.ref = "datetime" }
circular-reveal-switch = { group = "com.github.YenalyLiew", name = "CircularRevealSwitch", version.ref = "circularRevealSwitch" }
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugarJdkLibs" }
aboutlibraries-compose-m3 = { module = "com.mikepenz:aboutlibraries-compose-m3", version.ref = "aboutlibraries" }

# firebase
firebase-crashlytics = { group = "com.google.firebase", name = "firebase-crashlytics" }
firebase-analytics = { group = "com.google.firebase", name = "firebase-analytics" }
firebase-perf = { group = "com.google.firebase", name = "firebase-perf" }
firebase-config = { group = "com.google.firebase", name = "firebase-config" }
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }

[bundles]

android-base = [
    "core",
    "appcompat",
    "material",
